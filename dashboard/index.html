<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1280, initial-scale=1, user-scalable=no">
  <meta name="theme-color" content="#f4f6f9">
  <title>Home HQ</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon-192.png">
  <link rel="preload" href="/fonts/figtree-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/ovo-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/views/home.css">
  <link rel="stylesheet" href="css/views/calendar.css">
  <link rel="stylesheet" href="css/views/shopping.css">
  <link rel="stylesheet" href="css/views/meals.css">
  <link rel="stylesheet" href="css/views/weather.css">
  <link rel="stylesheet" href="css/views/transit.css">
  <link rel="stylesheet" href="css/views/photos.css">
  <link rel="stylesheet" href="css/views/control.css">
  <link rel="stylesheet" href="css/views/huckleberry.css">
  <link rel="stylesheet" href="css/views/ambient.css">
</head>
<body>
  <div class="stage" id="stage" data-mode="day">
    <nav class="rail" id="rail" aria-label="Sections">
      <button class="rail-item" data-go="home"><svg class="i" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg><span>Today</span></button>
      <button class="rail-item" data-go="calendar"><svg class="i" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Calendar</span></button>
      <button class="rail-item" data-go="shopping"><svg class="i" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2.2l2.3 11h10.8L21 8H6.5"/><circle cx="10" cy="19.5" r="1.5"/><circle cx="17" cy="19.5" r="1.5"/></svg><span>Shopping</span></button>
      <button class="rail-item" data-go="meals"><svg class="i" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v8M4.5 3v5a2.5 2.5 0 0 0 5 0V3M7 11v10M17 21V3c-2.5 1.5-3.5 4-3.5 8h3.5"/></svg><span>Meals</span></button>
      <button class="rail-item" data-go="transit"><svg class="i" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="14" rx="3"/><path d="M5 11h14M9 21l2-4M15 21l-2-4"/><circle cx="9" cy="14" r=".6"/><circle cx="15" cy="14" r=".6"/></svg><span>Transit</span></button>
      <button class="rail-item" data-go="control"><svg class="i" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg><span>Home</span></button>
      <button class="rail-item" data-go="huckleberry"><svg class="i" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M9.2 10.5h.01M14.8 10.5h.01M9.5 14.5c.7.8 1.5 1.2 2.5 1.2s1.8-.4 2.5-1.2M12 3.5c-.4-1.4.6-2 1.6-1.6"/></svg><span>Baby</span></button>
      <button class="rail-item rail-sleep" id="railSleep"><svg class="i" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.2 8.2 0 0 1 9.5 4 8.2 8.2 0 1 0 20 14.5z"/></svg><span>Sleep</span></button>
      <button class="rail-clock" id="railClock" aria-label="Clock"></button>
    </nav>

    <main class="views">
      <section class="view" id="view-home" data-view="home"></section>
      <section class="view" id="view-calendar" data-view="calendar"></section>
      <section class="view" id="view-shopping" data-view="shopping"></section>
      <section class="view" id="view-meals" data-view="meals"></section>
      <section class="view" id="view-transit" data-view="transit"></section>
      <section class="view" id="view-weather" data-view="weather"></section>
      <section class="view" id="view-control" data-view="control"></section>
      <section class="view" id="view-huckleberry" data-view="huckleberry"></section>
      <div class="banners" id="banners"></div>
    </main>

    <div class="toasts" id="toasts" aria-live="polite"></div>
    <div class="sheet-layer" id="sheetLayer"></div>
    <div class="takeover" id="takeover" role="alertdialog"></div>
    <div class="ambient" id="ambient"></div>
  </div>

  <script>
    // Wall-display self-healing: if the app bundle failed to load (e.g. a stale page right after a
    // deploy, or a network blip), reload until it starts.
    setTimeout(function () { if (!window.App) location.reload(); }, 10000);
  </script>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
